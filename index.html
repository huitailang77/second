<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆翻牌 · Memory Flip</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>记忆<span>翻牌</span></h1>
    <p class="sub">翻开两张卡片，图案相同即配对成功 —— 用最少的步数清空棋盘</p>
  </header>

  <div class="controls">
    <div class="seg" id="levels">
      <button data-level="easy">简单 6 对</button>
      <button data-level="normal" class="active">普通 8 对</button>
      <button data-level="hard">困难 12 对</button>
    </div>
    <button class="btn" id="restart">重新开始</button>
  </div>

  <div class="stats">
    <div class="stat"><span class="label">步数</span><span class="value" id="moves">0</span></div>
    <div class="stat"><span class="label">配对</span><span class="value" id="pairs">0/8</span></div>
    <div class="stat"><span class="label">用时</span><span class="value" id="time">00:00</span></div>
    <div class="stat"><span class="label">最佳步数</span><span class="value" id="best">—</span></div>
  </div>

  <div id="board" aria-label="翻牌棋盘"></div>

  <section class="rules">
    <h2>玩法规则</h2>
    <ol>
      <li>棋盘上每张图案都恰好出现两次，点开两张卡，图案相同即配对成功并保持翻开。</li>
      <li>图案不同时，两张卡会在 0.75 秒后自动翻回。</li>
      <li>每点开两张卡记为一步；计时从第一次点击开始，直到全部配对完成。</li>
      <li>评级：步数 ≤ 对数 × 1.5 得三星，≤ 对数 × 2.5 得两星，其余一星。</li>
      <li>最佳步数按难度分别保存在你的浏览器本地。</li>
    </ol>
  </section>

  <div class="overlay hidden" id="win">
    <div class="panel">
      <h2>🎉 全部配对完成</h2>
      <p class="stars" id="winStars">★★★</p>
      <p id="winDetail"></p>
      <p class="best" id="winBest"></p>
      <button class="btn primary" id="playAgain">再来一局</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
