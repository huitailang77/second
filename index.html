<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆翻牌 · Memory Flip</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --cols: 4;
    --accent: #6ee7ff;
    --panel: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .12);
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaeefc;
    background:
      radial-gradient(900px 600px at 15% 0%, #2c3364 0%, transparent 60%),
      radial-gradient(800px 600px at 90% 20%, #3a1f4d 0%, transparent 55%),
      #0f1122 fixed;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 标题 ---------- */
  header { text-align: center; }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4vw, 30px);
    letter-spacing: .5px;
  }
  h1 span {
    background: linear-gradient(90deg, #6ee7ff, #b28bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin: 0 0 20px;
    color: #9aa3c7;
    font-size: 14px;
  }

  /* ---------- 控制区 ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .seg {
    display: flex;
    gap: 6px;
    padding: 5px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .seg button {
    padding: 7px 14px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #b9c2e3;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
  }
  .seg button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  .seg button.active {
    background: linear-gradient(135deg, #6ee7ff, #8b7bff);
    color: #0d1020;
    font-weight: 600;
  }

  .btn {
    padding: 10px 20px;
    border: 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, .1);
    color: #e6eaff;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .btn:hover { background: rgba(255, 255, 255, .18); }
  .btn.primary {
    background: linear-gradient(135deg, #6ee7ff, #8b7bff);
    color: #0d1020;
  }
  .btn.primary:hover { filter: brightness(1.1); }

  /* ---------- 状态栏 ---------- */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .stat {
    min-width: 82px;
    padding: 8px 16px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(6px);
  }
  .stat .label {
    display: block;
    margin-bottom: 2px;
    font-size: 11px;
    letter-spacing: .08em;
    color: #98a2c6;
  }
  .stat .value {
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 棋盘 ---------- */
  #board {
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap: 10px;
    width: min(calc(100vw - 32px),
               calc(var(--cols) * 96px + (var(--cols) - 1) * 10px));
    perspective: 1200px;
    margin-bottom: 26px;
  }

  .card {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    perspective: 700px;
    transition: transform .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:disabled { cursor: default; opacity: 1; }
  .card:not(.flipped):not(.matched):hover { transform: translateY(-4px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 14px; }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.35, .1, .25, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-size: clamp(20px, 3.6vw, 34px);
    user-select: none;
  }
  .card-back {
    background: linear-gradient(145deg, #3b4380, #232a58);
    border: 1px solid rgba(255, 255, 255, .13);
    box-shadow: inset 0 0 24px rgba(110, 231, 255, .12), 0 6px 14px rgba(0, 0, 0, .25);
    color: #7f8bff;
    font-size: clamp(16px, 2.6vw, 22px);
    font-weight: 700;
    transition: box-shadow .2s, border-color .2s;
  }
  .card:hover .card-back {
    border-color: rgba(110, 231, 255, .55);
    box-shadow: inset 0 0 24px rgba(110, 231, 255, .25), 0 8px 18px rgba(0, 0, 0, .3);
  }
  .card-front {
    background: linear-gradient(145deg, #fbfcff, #dde4ff);
    transform: rotateY(180deg);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .25);
  }
  .card.matched { cursor: default; animation: pop .35s ease; }
  .card.matched .card-front {
    background: linear-gradient(145deg, #c6ffe3, #7ef0b3);
    box-shadow: 0 0 0 2px rgba(126, 240, 179, .6), 0 0 22px rgba(126, 240, 179, .35);
  }
  @keyframes pop {
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ---------- 规则 ---------- */
  .rules {
    width: min(100%, 640px);
    padding: 16px 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    font-size: 14px;
    line-height: 1.85;
    color: #c3cbe8;
  }
  .rules h2 {
    margin: 0 0 8px;
    font-size: 15px;
    letter-spacing: .05em;
    color: #fff;
  }
  .rules ol { margin: 0; padding-left: 20px; }
  .rules li::marker { color: var(--accent); }

  /* ---------- 结算弹层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    background: rgba(8, 10, 22, .72);
    backdrop-filter: blur(6px);
    animation: fade .25s ease;
  }
  .overlay.hidden { display: none; }

  .panel {
    width: min(90vw, 380px);
    padding: 26px 24px;
    text-align: center;
    background: linear-gradient(160deg, #232a58, #171b38);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    animation: rise .3s ease;
  }
  .panel h2 { margin: 0 0 10px; font-size: 20px; }
  .panel p { margin: 6px 0; font-size: 14px; color: #c3cbe8; }
  .panel b { color: #fff; }
  .stars {
    font-size: 28px !important;
    letter-spacing: 6px;
    color: #ffd76e;
    margin: 4px 0 10px !important;
  }
  .best { min-height: 20px; color: #7ef0b3 !important; }
  .panel .btn { margin-top: 16px; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
</style>
</head>
<body>

<header>
  <h1>记忆<span>翻牌</span></h1>
  <p class="sub">翻开两张卡片，图案相同即配对成功 —— 用最少的步数清空棋盘</p>
</header>

<div class="controls">
  <div class="seg" id="levels">
    <button data-level="easy">简单 6 对</button>
    <button data-level="normal" class="active">普通 8 对</button>
    <button data-level="hard">困难 12 对</button>
  </div>
  <button class="btn" id="restart">重新开始</button>
</div>

<div class="stats">
  <div class="stat"><span class="label">步数</span><span class="value" id="moves">0</span></div>
  <div class="stat"><span class="label">配对</span><span class="value" id="pairs">0/8</span></div>
  <div class="stat"><span class="label">用时</span><span class="value" id="time">00:00</span></div>
  <div class="stat"><span class="label">最佳步数</span><span class="value" id="best">—</span></div>
</div>

<div id="board" aria-label="翻牌棋盘"></div>

<section class="rules">
  <h2>玩法规则</h2>
  <ol>
    <li>棋盘上每张图案都恰好出现两次，点开两张卡，图案相同即配对成功并保持翻开。</li>
    <li>图案不同时，两张卡会在 0.75 秒后自动翻回。</li>
    <li>每点开两张卡记为一步；计时从第一次点击开始，直到全部配对完成。</li>
    <li>评级：步数 ≤ 对数 × 1.5 得三星，≤ 对数 × 2.5 得两星，其余一星。</li>
    <li>最佳步数按难度分别保存在你的浏览器本地。</li>
  </ol>
</section>

<div class="overlay hidden" id="win">
  <div class="panel">
    <h2>🎉 全部配对完成</h2>
    <p class="stars" id="winStars">★★★</p>
    <p id="winDetail"></p>
    <p class="best" id="winBest"></p>
    <button class="btn primary" id="playAgain">再来一局</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ========== 配置 ========== */
  const LEVELS = {
    easy:   { name: '简单', pairs: 6,  cols: 4 },
    normal: { name: '普通', pairs: 8,  cols: 4 },
    hard:   { name: '困难', pairs: 12, cols: 6 }
  };
  const EMOJIS = ['🍎','🍇','🍉','🍋','🍓','🥑','🍍','🥝','🌽','🍄','🌶️','🥕','🍔','🍕','🍩','🍪','🍫','🍿'];
  const FLIP_BACK_DELAY = 750;

  /* ========== DOM ========== */
  const board   = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const timeEl  = document.getElementById('time');
  const bestEl  = document.getElementById('best');
  const winEl   = document.getElementById('win');

  /* ========== 状态 ========== */
  let levelKey = 'normal';
  let cfg, first, second, lock, moves, matched, seconds, timerId, started;

  /* ========== 工具 ========== */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function fmt(sec) {
    return String(Math.floor(sec / 60)).padStart(2, '0') + ':' +
           String(sec % 60).padStart(2, '0');
  }

  function getBest(level) {
    try {
      const v = localStorage.getItem('memory-best-' + level);
      return v === null ? null : parseInt(v, 10);
    } catch (e) { return null; }
  }

  function setBest(level, value) {
    try { localStorage.setItem('memory-best-' + level, String(value)); } catch (e) {}
  }

  /* ========== 渲染 ========== */
  function updateHud() {
    movesEl.textContent = moves;
    pairsEl.textContent = matched + '/' + cfg.pairs;
    timeEl.textContent = fmt(seconds);
    const b = getBest(levelKey);
    bestEl.textContent = (b === null) ? '—' : b;
  }

  function init(key) {
    if (key) levelKey = key;
    cfg = LEVELS[levelKey];

    clearInterval(timerId);
    timerId = null;
    first = second = null;
    lock = false;
    moves = 0;
    matched = 0;
    seconds = 0;
    started = false;

    document.documentElement.style.setProperty('--cols', cfg.cols);

    // 生成牌堆：取 pairs 个图案，各复制一份后洗牌
    const picked = shuffle(EMOJIS.slice()).slice(0, cfg.pairs);
    const deck = shuffle(picked.concat(picked));

    board.innerHTML = '';
    const frag = document.createDocumentFragment();

    deck.forEach(function (emoji) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.setAttribute('aria-label', '未翻开的卡片');
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back">?</div>' +
          '<div class="card-face card-front">' + emoji + '</div>' +
        '</div>';
      card.addEventListener('click', function () { onFlip(card); });
      frag.appendChild(card);
    });

    board.appendChild(frag);
    winEl.classList.add('hidden');
    updateHud();
  }

  /* ========== 计时 ========== */
  function startTimer() {
    started = true;
    timerId = setInterval(function () {
      seconds++;
      timeEl.textContent = fmt(seconds);
    }, 1000);
  }

  /* ========== 核心逻辑 ========== */
  function onFlip(card) {
    if (lock) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    if (!started) startTimer();

    card.classList.add('flipped');
    card.setAttribute('aria-label', '已翻开');

    if (!first) {           // 本回合第一张
      first = card;
      return;
    }

    // 本回合第二张
    second = card;
    moves++;
    updateHud();

    if (first.dataset.emoji === second.dataset.emoji) {
      const a = first, b = second;
      first = second = null;

      a.classList.add('matched');
      b.classList.add('matched');
      a.disabled = true;
      b.disabled = true;

      matched++;
      updateHud();

      if (matched === cfg.pairs) win();
    } else {
      const a = first, b = second;
      first = second = null;
      lock = true;

      setTimeout(function () {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        a.setAttribute('aria-label', '未翻开的卡片');
        b.setAttribute('aria-label', '未翻开的卡片');
        lock = false;
      }, FLIP_BACK_DELAY);
    }
  }

  function win() {
    clearInterval(timerId);
    timerId = null;
    started = false;

    const ratio = moves / cfg.pairs;
    const stars = ratio <= 1.5 ? 3 : (ratio <= 2.5 ? 2 : 1);

    const prev = getBest(levelKey);
    const isNew = (prev === null || moves < prev);
    if (isNew) setBest(levelKey, moves);

    document.getElementById('winStars').textContent =
      '★'.repeat(stars) + '☆'.repeat(3 - stars);
    document.getElementById('winDetail').innerHTML =
      '难度 <b>' + cfg.name + '</b> ｜ 用时 <b>' + fmt(seconds) +
      '</b> ｜ 步数 <b>' + moves + '</b>';
    document.getElementById('winBest').textContent =
      isNew ? '🏆 新纪录！' : ('本难度最佳：' + prev + ' 步');

    updateHud();
    winEl.classList.remove('hidden');
  }

  /* ========== 事件绑定 ========== */
  document.getElementById('levels').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-level]');
    if (!btn) return;
    Array.prototype.forEach.call(btn.parentElement.children, function (b) {
      b.classList.toggle('active', b === btn);
    });
    init(btn.dataset.level);
  });

  document.getElementById('restart').addEventListener('click', function () { init(); });
  document.getElementById('playAgain').addEventListener('click', function () { init(); });

  /* ========== 启动 ========== */
  init(levelKey);
})();
</script>
</body>
</html>
